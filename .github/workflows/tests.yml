name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python -m pip install --upgrade pip
          case "$PYTHON_VERSION" in
            3.10)
              python -m pip install -e '.[dev]'
              ;;
            3.11)
              constraints="$RUNNER_TEMP/triagecore-fastapi-constraints.txt"
              printf '%s\n' 'fastapi==0.163.2' > "$constraints"
              python -m pip install -c "$constraints" -e '.[dev,mobile]'
              ;;
            *)
              python -m pip install -e '.[dev,mobile]'
              ;;
          esac

      - name: Run core tests
        if: matrix.python-version == '3.10'
        run: python -m pytest -q --ignore=tests/test_mobile_web.py

      - name: Verify mobile is rejected on Python 3.10
        if: matrix.python-version == '3.10'
        run: |
          resolver_log="$RUNNER_TEMP/triagecore-mobile-resolver.log"
          if python -m pip install --dry-run --ignore-installed '.[mobile]' > "$resolver_log" 2>&1; then
            echo "Mobile dependency resolution unexpectedly succeeded."
            exit 1
          fi
          if ! grep -Fq 'No matching distribution found for fastapi>=0.163.2' "$resolver_log" ||
             ! grep -Eq '0\.163\.2 Requires-Python >=3\.11([,;[:space:]]|$)' "$resolver_log"; then
            cat "$resolver_log"
            exit 1
          fi
          echo "Mobile resolution rejected FastAPI 0.163.2 because it requires Python 3.11 or later."

          startup_log="$RUNNER_TEMP/triagecore-mobile-startup.log"
          ledger="$RUNNER_TEMP/triagecore-python310-ledger"
          if TRIAGECORE_MOBILE_TOKEN= TRIAGECORE_LEDGER_DIR="$ledger" \
             python -m triage_core.web.server > "$startup_log" 2>&1; then
            echo "Mobile startup unexpectedly succeeded."
            exit 1
          fi
          if ! grep -Fq 'TriageCore Mobile requires Python 3.11 or later.' "$startup_log" ||
             [[ -e "$ledger" ]]; then
            cat "$startup_log"
            exit 1
          fi
          echo "Mobile startup rejected Python 3.10 before creating a ledger."

      - name: Verify mobile runtime and run full suite
        if: matrix.python-version != '3.10'
        run: |
          python - <<'PY'
          import sys

          import fastapi
          from packaging.version import Version

          installed = Version(fastapi.__version__)
          minimum = Version("0.163.2")
          print(f"Python {sys.version.split()[0]}, FastAPI {installed}")
          if sys.version_info[:2] == (3, 11) and installed != minimum:
              raise SystemExit(f"Expected minimum supported FastAPI {minimum}.")
          if installed < minimum:
              raise SystemExit(f"FastAPI must be {minimum} or later.")
          PY

          python -m pytest -q --junitxml="$RUNNER_TEMP/triagecore-pytest.xml"

          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path(os.environ["RUNNER_TEMP"]) / "triagecore-pytest.xml"
          cases = ElementTree.parse(report).findall(".//testcase[@classname='tests.test_mobile_web']")
          if not cases or any(
              case.find(outcome) is not None
              for case in cases
              for outcome in ("skipped", "failure", "error")
          ):
              raise SystemExit("The mobile test module must run and pass without skips.")
          print(f"Mobile tests passed: {len(cases)}")
          PY

  public_export_staging:
    name: Grant B staging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Exercise native staging and the frozen synthetic corpus
        shell: bash
        env:
          # The hosted Windows profile temp failed the native directory-identity check.
          # Build synthetic repositories and private staging directories in job-local temp.
          TMPDIR: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path(os.environ["RUNNER_TEMP"]) / "public-export-staging.xml"
          modules = ("policy", "release", "staging", "evidence", "cli")
          subprocess.run([
              sys.executable, "-m", "pytest", "-q", "-o", "junit_family=xunit1",
              f"--junitxml={report}", "tests/test_public_export.py",
              *(f"tests/test_public_export_{module}.py" for module in modules),
          ], check=True)
          root = ElementTree.parse(report)
          if root.find(".//skipped") is not None:
              raise SystemExit("Mandatory Grant B checks must run on the selected native platform")
          cases = [json.loads(prop.attrib["value"])
                   for prop in root.findall(".//property[@name='grant_b_case']")]
          if len(cases) != 54 or len({case["case_id"] for case in cases}) != 54:
              raise SystemExit("Expected 54 distinct measured Grant B cases")
          if any(case["tested_commit"] != os.environ["GITHUB_SHA"] for case in cases):
              raise SystemExit("Corpus evidence must identify the tested checkout")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print("### Grant B native staging evidence", file=summary)
              print("\n54 synthetic cases, each exercised twice. All mandatory checks passed.", file=summary)
              print("\n<details><summary>Case-level measurements (JSON)</summary>\n", file=summary)
              print("```json", json.dumps(cases, sort_keys=True), "```", sep="\n", file=summary)
              print("\n</details>", file=summary)
          PY

  # CR-OC-001C Windows/NTFS evidence. Additive: the Ubuntu matrix above is
  # unchanged, and is deliberately NOT converted into an OS x Python matrix.
  windows_executor:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify workspace volume is NTFS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $letter = (Get-Item -LiteralPath $env:GITHUB_WORKSPACE).PSDrive.Name
          $fs = $null
          try { $fs = (Get-Volume -DriveLetter $letter).FileSystem } catch { }
          if ([string]::IsNullOrWhiteSpace($fs)) {
            $fs = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$letter`:'").FileSystem
          }
          if ([string]::IsNullOrWhiteSpace($fs)) {
            Write-Error "workspace filesystem type could not be determined"; exit 1
          }
          if ($fs -ne 'NTFS') {
            Write-Error "workspace volume is $fs, not NTFS"; exit 1
          }
          "workspace_filesystem=$fs" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Run mandatory Windows executor group
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xml = Join-Path $env:RUNNER_TEMP 'mediated-executor.xml'
          "mandatory_result=$xml" | Out-File -Append -FilePath $env:GITHUB_ENV
          # junit_family=legacy is required for testcase-level <property>
          # elements: the default xunit2 schema does not permit them, so
          # record_property would be dropped and the transition gate would
          # silently have nothing to read. Applied here only -- pyproject.toml
          # is not touched and the Ubuntu jobs are unaffected.
          python -m pytest `
            tests/test_mediated_executor.py `
            tests/test_privacy_invariants.py `
            tests/test_governed_consumption_parity.py `
            -m "not windows_optional" -q `
            -o junit_family=legacy --junit-xml=$xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Gate on the structured mandatory result
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $accepted = @('False->False', 'False->True', 'True->True')
          $path = $env:mandatory_result
          if (-not (Test-Path -LiteralPath $path)) {
            Write-Error "mandatory result file is absent"; exit 1
          }
          try { [xml]$doc = Get-Content -LiteralPath $path -Raw }
          catch { Write-Error "mandatory result file could not be parsed"; exit 1 }

          # Sum ONLY leaf suites: pytest emits a root <testsuites> wrapper plus
          # child <testsuite> totals, and summing both would double-count.
          $suites = $doc.SelectNodes("//testsuite[not(.//testsuite)]")
          if ($null -eq $suites -or $suites.Count -lt 1) {
            Write-Error "mandatory result contains no leaf testsuite"; exit 1
          }
          $tests = 0; $failures = 0; $errors = 0; $skipped = 0
          foreach ($s in $suites) {
            foreach ($pair in @(@('tests',[ref]$tests), @('failures',[ref]$failures),
                                @('errors',[ref]$errors), @('skipped',[ref]$skipped))) {
              $raw = $s.GetAttribute($pair[0])
              if ([string]::IsNullOrWhiteSpace($raw)) {
                Write-Error "testsuite is missing the $($pair[0]) attribute"; exit 1
              }
              $parsed = 0
              if (-not [int]::TryParse($raw, [ref]$parsed)) {
                Write-Error "testsuite $($pair[0]) is not an integer"; exit 1
              }
              $pair[1].Value += $parsed
            }
          }
          if ($tests -lt 1) { Write-Error "mandatory group ran no tests"; exit 1 }
          if ($failures -ne 0 -or $errors -ne 0) {
            Write-Error "mandatory group reported failures=$failures errors=$errors"; exit 1
          }
          if ($skipped -ne 0) {
            Write-Error "mandatory group reported $skipped skip(s); zero are permitted"; exit 1
          }

          $t35 = $doc.SelectNodes("//testcase[contains(@name,'t35w_auto_inherited')]")
          if ($t35.Count -ne 1) {
            Write-Error "expected exactly one T35[W] case, found $($t35.Count)"; exit 1
          }
          $props = $doc.SelectNodes("//property[@name='se_dacl_auto_inherited_transition']")
          if ($props.Count -ne 1) {
            Write-Error "expected exactly one transition property, found $($props.Count)"; exit 1
          }
          $transition = $props[0].GetAttribute('value')
          if ($accepted -notcontains $transition) {
            Write-Error "transition '$transition' is not an accepted transition"; exit 1
          }

          "mandatory_tests=$tests"       | Out-File -Append -FilePath $env:GITHUB_ENV
          "mandatory_skipped=$skipped"   | Out-File -Append -FilePath $env:GITHUB_ENV
          "dacl_transition=$transition"  | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Supplemental symlink probe (non-gating)
        shell: pwsh
        continue-on-error: true
        run: |
          python -m pytest tests/test_mediated_executor.py -m windows_optional -q
          if ($LASTEXITCODE -eq 0) { $status = 'pass' } else { $status = 'environment-unavailable' }
          "symlink_probe=$status" | Out-File -Append -FilePath $env:GITHUB_ENV
          exit 0

      - name: Bounded job summary
        if: always()
        shell: pwsh
        run: |
          # Bounded counters and identifiers only. No raw XML, no test output,
          # no file content, paths, artifact names, ACLs, descriptors, tokens,
          # or credentials. The recorded transition is observational (CR 10.1a)
          # and is never a pass/fail criterion for the normalization itself.
          $lines = @(
            "### CR-OC-001C Windows executor evidence",
            "",
            "| field | value |",
            "| --- | --- |",
            "| commit | $env:GITHUB_SHA |",
            "| windows build | $([System.Environment]::OSVersion.Version.ToString()) |",
            "| python | $(python -c 'import platform;print(platform.python_version())') |",
            "| filesystem | $env:workspace_filesystem |",
            "| mandatory tests | $env:mandatory_tests |",
            "| mandatory skipped | $env:mandatory_skipped |",
            "| SE_DACL_AUTO_INHERITED transition | $env:dacl_transition |",
            "| symlink probe (supplemental) | $env:symlink_probe |"
          )
          $lines -join "`n" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
