<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Workspace Unifier subsystem architecture</title>
  <desc id="desc">A local-first subsystem diagram. Solid blue paths remain inside current TriageCore or stop at its implemented static export boundary. Dashed gray paths continue into conceptual and disconnected coordination actors. Dashed purple paths are external observation signals. Amber represents explicit human authority. Current TriageDesk review and observability is separate from a future disconnected TriageDesk action and executor bridge.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f5d96"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a45a00"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6750a4"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#18212f" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 31px Inter, Segoe UI, Arial, sans-serif; fill: #18212f; }
      .subtitle { font: 400 16px Inter, Segoe UI, Arial, sans-serif; fill: #5d6b7c; }
      .section { font: 700 19px Inter, Segoe UI, Arial, sans-serif; fill: #18212f; }
      .section-small { font: 700 17px Inter, Segoe UI, Arial, sans-serif; fill: #18212f; }
      .node-title { font: 700 16px Inter, Segoe UI, Arial, sans-serif; fill: #18212f; }
      .body { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Inter, Segoe UI, Arial, sans-serif; fill: #5d6b7c; }
      .edge-label { font: 600 12px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .boundary { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .boundary-concept { fill: #ffffff; stroke: #8793a3; stroke-width: 1.8; stroke-dasharray: 9 7; }
      .node-blue { fill: #eaf3fb; stroke: #8eb8dc; stroke-width: 1.5; }
      .node-green { fill: #e8f5ee; stroke: #8dc6a8; stroke-width: 1.5; }
      .node-amber { fill: #fff4df; stroke: #e4b86a; stroke-width: 2; }
      .node-amber-soft { fill: #fffaf0; stroke: #e4b86a; stroke-width: 1.4; }
      .node-purple { fill: #f2effb; stroke: #b6a8df; stroke-width: 1.5; }
      .node-neutral { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.25; }
      .artifact { fill: none; stroke: #1f5d96; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .authority { fill: none; stroke: #a45a00; stroke-width: 3; marker-end: url(#arrow-amber); }
      .signal { fill: none; stroke: #6750a4; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
      .disconnected { fill: none; stroke: #64748b; stroke-width: 2.3; stroke-dasharray: 8 6; marker-end: url(#arrow-gray); }
      .internal { fill: none; stroke: #64748b; stroke-width: 1.7; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f7f9fc"/>

  <text x="60" y="52" class="title">Workspace Unifier subsystem: current local core + disconnected actors</text>
  <text x="60" y="82" class="subtitle">A secondary logical architecture—not the complete current-system architecture.</text>

  <!-- Human authority and current review surfaces -->
  <g filter="url(#shadow)">
    <rect x="500" y="108" width="600" height="128" rx="16" class="node-amber"/>
  </g>
  <text x="800" y="137" text-anchor="middle" class="section">Human authority boundary</text>
  <rect x="520" y="151" width="270" height="63" rx="10" class="node-amber-soft"/>
  <text x="655" y="177" text-anchor="middle" class="node-title">Human operator (authority)</text>
  <text x="655" y="198" text-anchor="middle" class="small">selects • initiates • reviews • approves</text>
  <rect x="810" y="151" width="270" height="63" rx="10" class="node-blue"/>
  <text x="945" y="177" text-anchor="middle" class="node-title">TriageDesk review surface (current)</text>
  <text x="945" y="198" text-anchor="middle" class="small">observability only • presents evidence</text>

  <!-- Workspace inputs -->
  <g filter="url(#shadow)">
    <rect x="55" y="278" width="265" height="318" rx="16" class="boundary"/>
  </g>
  <text x="82" y="315" class="section">Workspace inputs</text>
  <rect x="82" y="340" width="211" height="60" rx="10" class="node-neutral"/>
  <text x="188" y="366" text-anchor="middle" class="node-title">User request / idea</text>
  <text x="188" y="386" text-anchor="middle" class="small">Operator-controlled intake</text>
  <rect x="82" y="420" width="211" height="60" rx="10" class="node-neutral"/>
  <text x="188" y="446" text-anchor="middle" class="node-title">GitHub issue import</text>
  <text x="188" y="466" text-anchor="middle" class="small">Preview artifact only</text>
  <rect x="82" y="500" width="211" height="68" rx="10" class="node-neutral"/>
  <text x="188" y="526" text-anchor="middle" class="node-title">Local YAML</text>
  <text x="188" y="547" text-anchor="middle" class="small">Private source-of-truth files</text>

  <!-- Current TriageCore boundary -->
  <g filter="url(#shadow)">
    <rect x="380" y="278" width="560" height="432" rx="18" class="boundary"/>
  </g>
  <text x="410" y="315" class="section">TriageCore / Workspace Unifier (current)</text>
  <text x="410" y="339" class="small">Local contract, state, policy, rendering, and static-export substrate</text>

  <rect x="410" y="366" width="235" height="112" rx="12" class="node-blue"/>
  <text x="528" y="395" text-anchor="middle" class="node-title">Intake + preview reservoir</text>
  <text x="528" y="421" text-anchor="middle" class="body">Parse candidate work</text>
  <text x="528" y="443" text-anchor="middle" class="body">Keep imports out of live state</text>
  <text x="528" y="463" text-anchor="middle" class="small">Fail loudly on malformed input</text>

  <rect x="675" y="366" width="235" height="112" rx="12" class="node-amber"/>
  <text x="793" y="395" text-anchor="middle" class="node-title">Policy + mutation valves</text>
  <text x="793" y="421" text-anchor="middle" class="body">Validate • privacy-check</text>
  <text x="793" y="443" text-anchor="middle" class="body">Promote • touch • close</text>
  <text x="793" y="463" text-anchor="middle" class="small">Explicit write intent required</text>

  <rect x="410" y="512" width="235" height="126" rx="12" class="node-green"/>
  <text x="528" y="541" text-anchor="middle" class="node-title">Local state reservoirs</text>
  <text x="528" y="568" text-anchor="middle" class="body">work_items.yaml</text>
  <text x="528" y="590" text-anchor="middle" class="body">today.yaml</text>
  <text x="528" y="614" text-anchor="middle" class="small">Board • WBS • now • review</text>

  <rect x="675" y="512" width="235" height="126" rx="12" class="node-blue"/>
  <text x="793" y="541" text-anchor="middle" class="node-title">Bounded exporters</text>
  <text x="793" y="568" text-anchor="middle" class="body">Handoff packet • dashboard</text>
  <text x="793" y="590" text-anchor="middle" class="body">Static evaluator-input JSON</text>
  <text x="793" y="614" text-anchor="middle" class="small">Selective, deterministic artifacts</text>

  <path d="M645 422 H668" class="internal"/>
  <path d="M793 478 V505" class="internal"/>
  <path d="M645 575 H668" class="internal"/>
  <path d="M528 478 V505" class="internal"/>

  <!-- Conceptual and disconnected actors -->
  <g filter="url(#shadow)">
    <rect x="1000" y="278" width="545" height="432" rx="18" class="boundary-concept"/>
  </g>
  <text x="1273" y="308" text-anchor="middle" class="section-small">Conceptual / disconnected coordination</text>
  <text x="1273" y="330" text-anchor="middle" class="section-small">and evaluation actors</text>
  <text x="1273" y="350" text-anchor="middle" class="small">Not current operational wiring</text>

  <rect x="1030" y="366" width="220" height="105" rx="12" class="node-neutral"/>
  <text x="1140" y="393" text-anchor="middle" class="node-title">Meta-harness</text>
  <text x="1140" y="416" text-anchor="middle" class="body">Conceptual coordination layer</text>
  <text x="1140" y="438" text-anchor="middle" class="small">No runtime engine</text>
  <text x="1140" y="457" text-anchor="middle" class="small">No approval authority</text>

  <rect x="1295" y="366" width="220" height="105" rx="12" class="node-neutral"/>
  <text x="1405" y="393" text-anchor="middle" class="node-title">Bounded agent</text>
  <text x="1405" y="416" text-anchor="middle" class="body">Potential packet consumer</text>
  <text x="1405" y="438" text-anchor="middle" class="small">Delivery is external</text>
  <text x="1405" y="457" text-anchor="middle" class="small">Permissions enforced separately</text>

  <rect x="1030" y="494" width="485" height="62" rx="12" class="node-neutral"/>
  <text x="1273" y="520" text-anchor="middle" class="node-title">Future TriageDesk action / executor bridge</text>
  <text x="1273" y="542" text-anchor="middle" class="small">Not implemented • requires a separately governed execution path</text>

  <rect x="1030" y="579" width="485" height="87" rx="12" class="node-purple"/>
  <text x="1273" y="604" text-anchor="middle" class="node-title">Independent evaluator workflow</text>
  <text x="1273" y="627" text-anchor="middle" class="body">TC exports static input; evaluator execution + result production stay external</text>
  <text x="1273" y="649" text-anchor="middle" class="small">Result display only • cannot approve, mutate, or invoke</text>

  <!-- Input and authority flows -->
  <path d="M293 370 H340 M293 450 H340 M340 370 V450" fill="none" stroke="#1f5d96" stroke-width="2.5"/>
  <path d="M340 410 H402" class="artifact"/>
  <text x="369" y="397" text-anchor="middle" class="edge-label">candidate data</text>
  <path d="M293 534 H355 C375 534 382 575 402 575" class="artifact"/>
  <text x="345" y="522" text-anchor="middle" class="edge-label">local state</text>
  <path d="M655 214 V270" class="authority"/>
  <text x="668" y="248" class="edge-label">explicit operator action</text>

  <!-- Implemented exports stop at the disconnected boundary -->
  <path d="M940 422 H982" class="artifact"/>
  <text x="957" y="408" text-anchor="middle" class="edge-label">handoff export</text>
  <path d="M982 422 H1022" class="disconnected"/>
  <path d="M1250 419 H1287" class="disconnected"/>

  <path d="M940 582 H982" class="artifact"/>
  <text x="957" y="568" text-anchor="middle" class="edge-label">static eval input</text>
  <path d="M982 582 H1010 V622 H1022" class="disconnected"/>

  <!-- Evidence and external observation returns -->
  <g filter="url(#shadow)">
    <rect x="520" y="790" width="560" height="116" rx="16" class="node-green"/>
  </g>
  <text x="800" y="824" text-anchor="middle" class="section">Reviewable results + evidence reservoir</text>
  <text x="800" y="854" text-anchor="middle" class="body">Changed artifacts • check results • unresolved risks • evaluator signals</text>
  <text x="800" y="880" text-anchor="middle" class="small">Passing checks and evaluator results remain evidence, not approval</text>

  <path d="M800 710 V782" class="artifact"/>
  <text x="815" y="754" class="edge-label">local evidence</text>
  <path d="M1405 471 V724 C1405 758 1360 769 1318 769 H1088" class="disconnected"/>
  <text x="1392" y="729" text-anchor="end" class="edge-label">disconnected work return</text>
  <path d="M1273 666 V735 C1273 757 1238 769 1195 769 H1088" class="signal"/>
  <text x="1260" y="706" text-anchor="end" class="edge-label">external result signal</text>
  <path d="M1515 622 H1560 V182 H1088" class="signal"/>
  <text x="1420" y="170" class="edge-label">display-only evaluator result</text>
  <path d="M520 848 C350 848 350 182 512 182" class="artifact"/>
  <text x="337" y="714" transform="rotate(-90 337 714)" class="edge-label">evidence for operator review</text>

  <!-- Legend -->
  <g transform="translate(60,944)">
    <path d="M0 0 H54" class="artifact"/>
    <text x="66" y="5" class="small">current typed artifact / evidence</text>
    <path d="M330 0 H384" class="disconnected"/>
    <text x="396" y="5" class="small">conceptual / disconnected transfer</text>
    <path d="M720 0 H774" class="signal"/>
    <text x="786" y="5" class="small">external observation signal only</text>
    <path d="M1080 0 H1134" class="authority"/>
    <text x="1146" y="5" class="small">explicit human authority</text>
  </g>
</svg>
