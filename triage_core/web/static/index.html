<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TriageCore Mobile</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="app-header">
        <h1>TriageCore</h1>
        <p id="connection-status" class="connection-status">Not connected</p>
    </header>

    <main class="app-content">
        <section id="auth-panel" class="auth-panel">
            <h2>Connect to local review</h2>
            <p>Enter the bearer token configured on the TriageCore host.</p>
            <form id="auth-form">
                <label for="mobile-token">Mobile token</label>
                <input
                    id="mobile-token"
                    name="mobile-token"
                    type="password"
                    autocomplete="current-password"
                    required
                >
                <button type="submit" class="btn primary">Connect</button>
            </form>
            <p id="auth-error" class="error-message" role="alert"></p>
        </section>

        <section id="ledger-panel" class="hidden">
            <p id="review-feedback" role="status" tabindex="-1"></p>
            <div id="task-list" class="task-list">
                <div class="loading">Connect to load tasks.</div>
            </div>
        </section>
    </main>

    <div id="review-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="review-modal-title" tabindex="-1">
        <form id="review-form" class="modal-content">
            <div class="modal-header">
                <h2 id="review-modal-title">Request review decision</h2>
                <button id="close-modal" type="button" class="close-btn" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <h3 id="modal-task-title"></h3>
                <div class="modal-meta">
                    <span id="modal-task-runner" class="badge"></span>
                    <span id="modal-task-status" class="badge"></span>
                </div>
                <p id="modal-review-status"></p>
                <p>An enrolled reviewer confirms this decision on the local desktop.</p>
                <div class="review-controls">
                    <label for="review-decision">Decision</label>
                    <select id="review-decision" required>
                        <option value="">Select a decision</option>
                        <option value="accepted">Accept</option>
                        <option value="accepted_with_minor_edits">Accept with minor edits</option>
                        <option value="needs_revision">Needs revision</option>
                        <option value="rejected">Reject</option>
                    </select>
                </div>
                <div class="review-controls">
                    <label for="review-workload">Workload</label>
                    <select id="review-workload">
                        <option value="not_recorded">Not Recorded</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <p id="review-error" class="error-message" role="alert"></p>
            </div>
            <div class="modal-footer">
                <button id="submit-review" type="submit" class="btn primary">Request local confirmation</button>
            </div>
        </form>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
